<!doctype html>
<html lang="sq">
  <head>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('katalogu-lipjan-theme');
          const systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = saved || (systemLight ? 'light' : 'dark');
        } catch { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Katalogu zyrtar dhe udhëzuesi digjital i bizneseve, shërbimeve dhe veprimtarive në Komunën e Lipjanit." />
    <title>Katalogu i Bizneseve të Komunës së Lipjanit</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
